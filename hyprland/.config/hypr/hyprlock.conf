# hyprlock — ports the old swaylock-effects look
# (screenshot background, white ring indicator, "locked." + clock)

general {
    ignore_empty_input = true       # was: ignore-empty-password
    grace = 0
    hide_cursor = true
}

# background ---------------------------------------------------------------
# swaylock used: screenshot + effect-greyscale + effect-pixelate=15
# hyprlock has no greyscale/pixelate; heavy blur is the closest analog.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.1696        # low vibrancy ~ desaturated, approximates greyscale
    vibrancy_darkness = 0.0
}

# password indicator -------------------------------------------------------
# swaylock ring: radius 100 / thickness 10, white ring, black inside.
# hyprlock's input-field is a rounded bar; rounding=-1 makes it pill-shaped.
input-field {
    monitor =
    size = 250, 55
    outline_thickness = 10           # was: indicator-thickness=10
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    rounding = -1

    inner_color = rgba(000000ff)     # inside-color
    outer_color = rgba(ffffffff)     # ring-color
    check_color = rgba(ffffffff)     # ring-ver-color (verifying)
    fail_color  = rgba(ff8888ff)     # ring-wrong-color
    capslock_color = rgba(ffff88ff)  # ring-caps-lock-color
    font_color = rgba(ffffffff)      # text-color

    fade_on_empty = false
    placeholder_text =
    fail_text = $FAIL
    position = 0, -130
    halign = center
    valign = center
}

# clock / labels -----------------------------------------------------------
# swaylock: timestr="locked." (big) + datestr=%R (the actual time)
label {
    monitor =
    text = locked.
    color = rgba(ffffffff)
    font_size = 42
    font_family = sans-serif
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME                     # %H:%M, equivalent to swaylock %R
    color = rgba(ffffffff)
    font_size = 22
    font_family = sans-serif
    position = 0, 30
    halign = center
    valign = center
}
