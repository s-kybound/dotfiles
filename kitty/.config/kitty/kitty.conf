# Color scheme: Catppuccin Mocha (https://github.com/catppuccin/kitty)
include theme.conf

# kitty's nerd font

symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Font

font_family      Iosevka
italic_font      Iosevka Italic
bold_font        Iosevka Bold
bold_italic_font Iosevka Bold Italic

# init
shell sh -c 'fortune | cowsay -r | fastfetch --file -; exec $SHELL'

# Layout & chrome
window_padding_width 8
background_opacity 0.92
dynamic_background_opacity yes

# Tab bar: slim powerline, colored from theme.conf above
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Modifier-key relay for tmux's i3/sway-like bindings (see
# ~/.config/tmux/tmux.conf, which binds M-<key>). modkey-gen.py builds
# the mappings from the single word in the sibling "modkey" file (super
# or alt) - that's the only thing to change per device, to match
# whichever modifier the window manager does NOT already grab.
# tmux.conf itself never needs to change: it binds the abstract M-
# (Meta) namespace regardless of which physical key produced it.
geninclude modkey-gen.py
