# ~/.config/tmux/tmux.conf
# Goals: (1) sensible default 3-pane layout on start, (2) mouse-friendly,
# (3) i3/sway-like keyboard control, driven by Super instead of Alt.
#
# NOTE on "Super": tmux has no native concept of a Super/Mod4 modifier
# (it only understands C- / M- / S-). Super is a WM-level key, so to use
# it for tmux we rely on the terminal translating "Super+key" into a
# classic Meta-prefixed escape sequence (ESC followed by the key), which
# tmux has always understood as "M-key". See the kitty.conf mappings
# ("Relay Super+<key>...") for the Super -> ESC+key relay. mainMod in
# hyprland.conf is ALT, so real Alt never reaches the terminal - these
# M- bindings are effectively Super-only, with no conflict.

# ---- General QoL ----
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g focus-events on
set -g main-pane-width 65%

# ---- Default startup layout: 1 main pane left, 2 stacked on the right ----
# Fires once per new session (not on re-attach), builds the layout, then
# hands focus back to the main (left) pane.
set-hook -g session-created 'split-window -h -c "#{pane_current_path}" ; split-window -v -c "#{pane_current_path}" ; select-layout main-vertical ; select-pane -t 0'

# ============================================================
# i3/sway-like bindings, all on Super (delivered as M- - see note above).
# These are root-table (-n): no prefix key needed, just like a WM.
# ============================================================

# Focus movement -> i3 mod+hjkl
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Move pane in a direction -> i3 mod+shift+hjkl (move container)
bind-key -n M-H swap-pane -t '{left-of}'
bind-key -n M-J swap-pane -t '{down-of}'
bind-key -n M-K swap-pane -t '{up-of}'
bind-key -n M-L swap-pane -t '{right-of}'

# Splits -> sway/i3-style split-horizontal / split-vertical, kept off hjkl
bind-key -n 'M-\' split-window -h -c "#{pane_current_path}"
bind-key -n M-_ split-window -v -c "#{pane_current_path}"

# Fullscreen -> i3 mod+f (tmux's equivalent is zooming the pane)
bind-key -n M-f resize-pane -Z

# Cycle layout -> loosely i3 mod+e (toggle split layout)
bind-key -n M-space next-layout

# New window / kill pane -> i3 mod+Enter / mod+shift+q
bind-key -n M-Enter new-window -c "#{pane_current_path}"
bind-key -n M-Q kill-pane

# Workspace-like window switching -> i3 mod+1..9 / mod+shift+1..9
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9
bind-key -n 'M-!' join-pane -t :1
bind-key -n 'M-@' join-pane -t :2
bind-key -n 'M-#' join-pane -t :3
bind-key -n 'M-$' join-pane -t :4
bind-key -n 'M-%' join-pane -t :5
bind-key -n 'M-^' join-pane -t :6
bind-key -n 'M-&' join-pane -t :7
bind-key -n 'M-*' join-pane -t :8
bind-key -n 'M-(' join-pane -t :9

# Resize mode -> i3 mod+r enters a mode where hjkl resizes repeatedly,
# Escape/Enter leaves it.
bind-key -n M-r switch-client -T resize
bind-key -T resize h resize-pane -L 5 \; switch-client -T resize
bind-key -T resize j resize-pane -D 5 \; switch-client -T resize
bind-key -T resize k resize-pane -U 5 \; switch-client -T resize
bind-key -T resize l resize-pane -R 5 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize Enter switch-client -T root

# Reload config -> i3 mod+shift+c
bind-key -n M-C source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Kill session (with confirmation) -> i3 mod+shift+e (exit)
bind-key -n M-E confirm-before -p "kill session #S? (y/n)" kill-session
